<style>

:root[data-theme="dark"]{

button,select{font:inherit;color:inherit}

.wrap{max-width:1180px;margin:0 auto}

.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px;padding:10px 16px}

header.hero{padding:28px 0 8px}

.prompt{font-family:var(--f-read);font-size:16px;line-height:1.65;margin:0 0 14px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.prompt p{margin:0 0 6px}.prompt p:last-child{margin:0}
.tcap{font-weight:700;font-size:15px;margin:0 0 6px;text-align:center}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.data{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.data th:first-child,table.data td:first-child{text-align:left;white-space:normal;min-width:7em}
table.data thead th{background:var(--head);font-weight:700;vertical-align:bottom}
table.data tbody tr:nth-child(even){background:var(--zebra)}

.tnote{font-size:12px;color:var(--muted);margin:6px 0 0}
.fig{margin:12px 0 0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}

.para{margin:0 0 14px;font-family:var(--f-read);font-size:17px;line-height:1.7}

.lockbox{text-align:center;color:var(--muted);padding:28px 8px;font-size:15px}

.w{background:linear-gradient(transparent 55%,var(--mark) 55%);color:var(--mark-ink);border:0;padding:0 1px;cursor:pointer;font-family:inherit;font-size:inherit;line-height:inherit;border-radius:2px}
.w:hover,.w.on{background:var(--mark)}
details.vocab{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}

.vlist{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 18px}
.vlist li{padding:8px 0;border-top:1px solid var(--line)}
.vw{font-weight:600}.vw small{font-weight:400;color:var(--muted);margin-left:6px}
.vvi{font-size:14px}

section.part{margin-bottom:28px;scroll-margin-top:70px}
section.part[hidden]{display:none}
.part h3{font-family:var(--f-read);font-weight:600;font-size:22px;margin:0 0 4px}
.instr{color:var(--muted);font-size:14px;margin:0 0 10px}
.gate{background:var(--sheet);border:1px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);margin-bottom:28px}
.gate b{color:var(--ink)}
.unlocked{background:var(--good-soft);color:var(--good);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;margin:0 0 14px}
.q{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:10px}
.q-top{display:flex;gap:10px;align-items:baseline}
.qn{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);min-width:2em}
.qt{flex:1;min-width:0}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px}
.quote{font-family:var(--f-read);font-style:italic}
.ctx{margin:10px 0 0;font-family:var(--f-read);font-size:16px;line-height:1.6;padding:8px 12px;border-left:3px solid var(--line);background:var(--bg);border-radius:0 8px 8px 0}
.who{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px;margin-top:16px;max-width:620px}

.who label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.who input,.who select{font:inherit;font-size:16px;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.who input:focus,.who select:focus{border-color:var(--accent)}
.who.need input:placeholder-shown,.who.need select:invalid{border-color:var(--bad);background:var(--bad-soft)}
.submit{flex-basis:100%;border-top:1px solid var(--line);padding-top:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.submit .btn{font-size:16px;padding:10px 18px;font-weight:600}

#sendStatus{font-size:14px;flex:1;min-width:200px}
#sendStatus.sent{color:var(--good);font-weight:600}
#sendStatus a{color:var(--accent);font-weight:600}
.write{flex-basis:100%;font-size:14px;background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:0}
.credit{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.5}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px;margin:12px 0 0;padding:0;list-style:none}
.opts.long{grid-template-columns:1fr}
.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-weight:700;color:var(--muted);min-width:1em}
.opt:disabled{cursor:default}
.ok{border-color:var(--good)!important;background:var(--good-soft)!important}
.ok .k{color:var(--good)}
.no{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.no .k{color:var(--bad)}
.why{margin-top:12px;border-radius:10px;padding:10px 12px;font-size:15px;background:var(--accent-soft)}
.why .vd{display:block;font-size:13px;font-weight:700;margin-bottom:2px}
.why.good .vd{color:var(--good)}.why.bad .vd{color:var(--bad)}

.bank{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin:0}
.bank ol{margin:0;padding-left:1.6em}
.bank li{padding:3px 0}
.bank li::marker{font-weight:700;color:var(--accent)}
.sel{width:100%;margin-top:10px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;cursor:pointer}
.sel:disabled{cursor:default;opacity:1}
.gaptext{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;font-family:var(--f-read);font-size:17px;line-height:1.75;margin-bottom:10px}
.gaptext h4{font-family:var(--f-ui);font-size:15px;margin:0 0 6px}
.gap{display:inline-block;min-width:2.6em;text-align:center;font-family:var(--f-ui);font-size:14px;font-weight:700;color:var(--accent);border-bottom:2px solid var(--accent);margin:0 2px;padding:0 4px}
.gap.filled{font-family:var(--f-read);font-weight:400;font-style:italic;color:var(--good);border-color:var(--good);text-align:left}

.result{margin-top:20px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.big{font-family:var(--f-read);font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:20px;color:var(--muted)}
.result p{margin:0;flex:1;min-width:200px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:99px;padding:7px 14px;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}

.fab{display:none;position:fixed;right:16px;bottom:16px;z-index:25;border:0;background:var(--accent);color:var(--sheet);border-radius:99px;padding:11px 16px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer}

.drawer{position:fixed;inset:0;z-index:40;background:rgba(10,15,25,.45);display:flex;align-items:flex-end}
.drawer[hidden]{display:none}
.drawer .panel{background:var(--sheet);width:100%;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px 28px}
.drawer .close{float:right;margin:2px 0 8px 8px}

.pop{position:absolute;z-index:50;max-width:min(320px,calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>

  const rows=t.rows.map(r=>'<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('');
  return `${t.caption?`<p class="tcap">${esc(t.caption)}</p>`:''}<div class="tscroll"><table class="data"><thead>${head}</thead><tbody>${rows}</tbody></table></div>${t.note?`<p class="tnote">${esc(t.note)}</p>`:''}`;
}

      const label=part.type==='match'?it.label:`Chỗ trống ${n}`;
      h+=`<div class="q" id="q${n}"><div class="q-top"><span class="qn">${n}.</span><div class="qt">${it.tag?`<span class="tag">${esc(it.tag)}</span>`:''}<b>${fmt(label)}</b></div></div>
        <select class="sel" data-q="${n}" aria-label="${esc(label)}"><option value="">— ${esc(part.pick||(part.type==='match'?'Chọn':'Chọn cụm từ'))} —</option>${part.options.map((o,oi)=>`<option value="${oi}">${part.plain?esc(o):lab(oi)+'. '+esc(o)}</option>`).join('')}</select>
        <div class="why" hidden></div></div>`;
    });
  }
  main.insertAdjacentHTML('beforeend',h+'</section>');
});
const total=n;
const beforeTotal=Object.values(Q).filter(q=>q.before).length;
function beforeDone(){let d=0;for(const i in Q)if(Q[i].before&&state[i]!==undefined)d++;return d}
function unlocked(){return beforeDone()>=beforeTotal}
main.insertAdjacentHTML('beforeend',`<div class="result" id="result"><div class="big" id="bigScore"></div><p id="resultMsg"></p><div class="acts"><button class="btn" id="btnWrong" type="button">Xem câu sai / chưa làm</button><button class="btn" id="btnReset" type="button">Làm lại từ đầu</button></div><div class="submit"><button class="btn primary" id="btnSubmit" type="button" disabled>📨 Nộp bài cho cô</button><div id="sendStatus"></div></div><p class="write">✍️ Con nên thử viết lại bài này (ít nhất 150 từ, tốt nhất khoảng 190 từ) bằng lời của mình, dựa vào các phân tích và từ vựng ngữ pháp vừa học, rồi gửi cô chấm qua Teams nhé.</p></div><p class="credit">${esc(L.source)}</p>`);

let wasOpen=null;
function applyLock(){
  const open=unlocked();
  document.querySelectorAll('section.part[data-after="1"]').forEach(s=>s.hidden=!open);
  document.querySelectorAll('.parts-nav a[data-after="1"]').forEach(a=>a.classList.toggle('locked',!open));
  const g=document.getElementById('gate'), m=document.getElementById('unlockMsg');
  if(g)g.hidden=open; if(m)m.hidden=!open;
  if(wasOpen===false&&open){tab='sample';}
  if(!open&&tab==='sample')tab='task';
  wasOpen=open; renderPanels();
}

/* answering */
function paint(i){
  const q=Q[i], box=document.getElementById('q'+i), pick=state[i];
  if(pick===undefined)return;
  const right=pick===q.ans;
  if(q.kind==='btn'){
    box.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const o=+b.dataset.o;if(o===q.ans)b.classList.add('ok');else if(o===pick)b.classList.add('no')});
  } else {
    const s=box.querySelector('.sel'); s.value=pick; s.disabled=true; s.classList.add(right?'ok':'no');
    if(q.gap){const g=document.getElementById('g'+i); if(g){g.textContent=q.text; g.classList.add('filled')}}
  }
  const why=box.querySelector('.why');
  why.className='why '+(right?'good':'bad');
  why.innerHTML=`<span class="vd">${right?'Đúng rồi!':'Chưa đúng. Đáp án: '+esc(q.label(q.ans))+(q.kind==='sel'&&!q.plain?' – '+esc(q.text||''):'')}</span>${fmt(q.why)}`;
  why.hidden=false;
}
function answer(i,v){
  if(state[i]!==undefined)return;
  state[i]=v;save();paint(i);updateScore();
  if(Q[i].before)applyLock();
}
function updateScore(){
  let done=0,ok=0; for(const i in Q){if(state[i]!==undefined){done++;if(state[i]===Q[i].ans)ok++}}
  document.getElementById('scoreTxt').textContent=`Đúng ${ok}/${total} · Đã làm ${done}`;
  document.getElementById('meter').style.width=(done/total*100)+'%';
  document.getElementById('bigScore').innerHTML=`${ok}<small>/${total}</small>`;
  let m;
  if(done<total)m=`Con đã làm ${done}/${total} câu. Làm tiếp các câu còn lại nhé.`;
  else if(ok>=18)m='Xuất sắc! Con đọc bảng và dùng ngôn ngữ số liệu rất tốt.';
  else if(ok>=14)m='Tốt lắm! Xem lại các câu sai và đọc kỹ phần giải thích nhé.';
  else if(ok>=10)m='Khá ổn. Đọc lại bài mẫu và từ vựng rồi bấm "Làm lại từ đầu".';
  else m='Cố lên! Đọc lại bảng thật chậm, xem kỹ bài mẫu rồi làm lại.';
  document.getElementById('resultMsg').textContent=m;
  refreshSubmit(done,ok);
}
document.addEventListener('change',e=>{
  const s=e.target.closest('.sel'); if(!s||s.value==='')return;
  answer(+s.dataset.q,+s.value);
});

/* drawer, popover */
const drawer=document.getElementById('drawer'), panel=document.getElementById('drawerPanel');
function openDrawer(){
  panel.innerHTML='<button class="btn close" type="button" id="closeDr">Đóng ✕</button><div id="drawerBody"></div>';
  drawer.hidden=false; document.body.style.overflow='hidden'; renderPanels();
}
function closeDrawer(){drawer.hidden=true;document.body.style.overflow='';hidePop()}
const pop=document.getElementById('pop'); let popFor=null;
function showPop(w){
  if(popFor===w){hidePop();return} hidePop();
  const v=V[w.dataset.k]; if(!v)return; popFor=w; w.classList.add('on');
  pop.innerHTML=`<div><b>${esc(v.word)}</b><span class="ipa">${esc(v.ipa)}</span></div><div>${esc(v.pos)} · ${esc(v.vi)}</div>`;
  pop.hidden=false;
  const r=w.getBoundingClientRect(), pw=pop.offsetWidth;
  const fixed=!drawer.hidden; pop.style.position=fixed?'fixed':'absolute';
  const sx=fixed?0:scrollX, sy=fixed?0:scrollY;
  let x=r.left+sx; x=Math.max(16,Math.min(x,sx+document.documentElement.clientWidth-pw-16));
  pop.style.left=x+'px'; pop.style.top=(r.bottom+sy+6)+'px';
}
function hidePop(){pop.hidden=true;if(popFor)popFor.classList.remove('on');popFor=null}
document.addEventListener('click',e=>{
  const o=e.target.closest('.opt');
  if(o&&!o.disabled){answer(+o.dataset.q,+o.dataset.o);return}
  const t=e.target.closest('.tab'); if(t){tab=t.dataset.tab;hidePop();renderPanels();return}
  const w=e.target.closest('.w[data-k]'); if(w){showPop(w);return}
  if(e.target.id==='fab'){openDrawer();return}
  if(e.target.id==='closeDr'||e.target===drawer){closeDrawer();return}
  if(!e.target.closest('#pop'))hidePop();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hidePop();if(!drawer.hidden)closeDrawer()}});
window.addEventListener('resize',hidePop);
document.getElementById('reading').addEventListener('scroll',hidePop);
document.getElementById('btnReset').onclick=()=>{
  state={};save();sent=false;saveSent();setStatus('');
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=false;b.classList.remove('ok','no')});
  document.querySelectorAll('.sel').forEach(s=>{s.disabled=false;s.value='';s.classList.remove('ok','no')});
  document.querySelectorAll('.gap').forEach(g=>{g.textContent=g.id.slice(1);g.classList.remove('filled')});
  document.querySelectorAll('.why').forEach(w=>w.hidden=true);
  wasOpen=null;tab='task';applyLock();updateScore();scrollTo({top:0});
};
document.getElementById('btnWrong').onclick=()=>{
  const ids=Object.keys(Q).map(Number);
  const t=ids.find(i=>state[i]!==undefined&&state[i]!==Q[i].ans)||ids.find(i=>state[i]===undefined);
  if(t){let el=document.getElementById('q'+t); if(el.closest('section').hidden)el=document.getElementById('gate'); el.scrollIntoView({block:'center'})}
};

/* student info + submit to teacher's Google Form */
const RESULTS={formUrl:"https://docs.google.com/forms/d/e/1FAIpQLSeOg0kZytzgKzyBIxFD-THAoS44sTOEvDr4VqO1LnX-6kmfYQ/",
  fields:{name:"entry.1398331139",cls:"entry.770361974",lesson:"entry.449687323",score:"entry.426447052",details:"entry.1388890653"}};
const SKEY='manners-student', SENTKEY=KEY+'-sent';
const nameEl=document.getElementById('stuName'), clsEl=document.getElementById('stuClass');
try{const s=JSON.parse(localStorage.getItem(SKEY)||'{}');if(s.name)nameEl.value=s.name;if(s.cls)clsEl.value=s.cls}catch(e){}
let sent=false; try{sent=localStorage.getItem(SENTKEY)==='1'}catch(e){}
const saveSent=()=>{try{sent?localStorage.setItem(SENTKEY,'1'):localStorage.removeItem(SENTKEY)}catch(e){}};
const student=()=>({name:nameEl.value.trim().replace(/\s+/g,' '),cls:clsEl.value});
function saveStudent(){try{localStorage.setItem(SKEY,JSON.stringify(student()))}catch(e){};updateScore()}
nameEl.addEventListener('input',saveStudent); clsEl.addEventListener('change',e=>{e.stopPropagation();saveStudent()});
const statusEl=document.getElementById('sendStatus'), btnSubmit=document.getElementById('btnSubmit');
function setStatus(html,ok){statusEl.innerHTML=html;statusEl.className=ok?'sent':''}
function refreshSubmit(done,ok){
  const s=student();
  if(sent){btnSubmit.disabled=true;btnSubmit.textContent='✅ Đã nộp';if(!statusEl.innerHTML)setStatus('Con đã nộp bài này. Muốn làm và nộp lại, bấm "Làm lại từ đầu".',true);return}
  btnSubmit.textContent='📨 Nộp bài cho cô';
  btnSubmit.disabled=done<total;
  if(statusEl.className==='sent')return;
  if(done<total)setStatus(`Làm đủ ${total} câu để nộp bài (còn ${total-done} câu).`);
  else if(!s.name||!s.cls)setStatus('Nhập <b>họ tên</b> và chọn <b>lớp</b> ở đầu trang rồi bấm Nộp bài.');
  else setStatus(`Sẵn sàng nộp: <b>${esc(s.name)}</b> · lớp ${esc(s.cls)} · ${ok}/${total} câu đúng.`);
}
function formParams(){
  const f=RESULTS.fields,p=new URLSearchParams(),s=student();
  let ok=0; const det=[];
  for(const i in Q){const g=state[i]===Q[i].ans; if(g)ok++; det.push(i+(g?'✓':'✗'))}
  p.append(f.name,s.name); p.append(f.cls,s.cls);
  p.append(f.lesson,`Task 1 Table ${L.id} · ${L.topic}`);
  p.append(f.score,`${ok}/${total} (${Math.round(ok/total*100)}%)`);
  p.append(f.details,det.join(' '));
  return p;
}
btnSubmit.onclick=()=>{
  const s=student();
  if(!s.name||!s.cls){document.getElementById('who').classList.add('need');scrollTo({top:0,behavior:'smooth'});(s.name?clsEl:nameEl).focus({preventScroll:true});setStatus('Con chưa nhập họ tên hoặc chưa chọn lớp ở đầu trang.');return}
  const params=formParams(); btnSubmit.disabled=true; setStatus('⏳ Đang gửi kết quả cho cô…');
  fetch(RESULTS.formUrl+'formResponse',{method:'POST',mode:'no-cors',body:params})
    .then(()=>{sent=true;saveSent();setStatus('✅ Đã gửi kết quả cho cô. Con không cần làm gì thêm.',true);btnSubmit.textContent='✅ Đã nộp'})
    .catch(()=>{btnSubmit.disabled=false;setStatus(`Chưa gửi được tự động. Bấm <a href="${RESULTS.formUrl}viewform?usp=pp_url&${params.toString().replace(/&/g,'&amp;')}" target="_blank" rel="noopener">📨 mở Google Form</a> rồi bấm <b>Gửi / Submit</b> để nộp bài.`)});
};
for(const i in Q)paint(+i);
applyLock();
updateScore();
</script>
