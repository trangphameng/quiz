<html lang="vi">
<head>

<title>Lesson 07 · Tidy Desks, Happy Lunches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#EDF1F6; --sheet:#FFFFFF; --ink:#1A2333; --muted:#5B667A; --line:#D5DCE7;
  --accent:#2C4A9E; --accent-soft:#E3E9F8; --mark:#FFE27A; --mark-ink:#1A2333;
  --good:#1D7F55; --good-soft:#E1F4EA; --bad:#B83A33; --bad-soft:#FBE6E4;
  --f-ui:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111722; --sheet:#1A2230; --ink:#E6EBF4; --muted:#9BA6B9; --line:#2D374A;
  --accent:#93AAFF; --accent-soft:#232F4D; --mark:#6B5A1C; --mark-ink:#FFF3C9;
  --good:#58C892; --good-soft:#163428; --bad:#F2837B; --bad-soft:#3A1E1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111722; --sheet:#1A2230; --ink:#E6EBF4; --muted:#9BA6B9; --line:#2D374A;
  --accent:#93AAFF; --accent-soft:#232F4D; --mark:#6B5A1C; --mark-ink:#FFF3C9;
  --good:#58C892; --good-soft:#163428; --bad:#F2837B; --bad-soft:#3A1E1D; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;padding:0 16px 96px}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}

.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:0 -16px;padding:10px 16px}
.bar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar a.home{color:var(--accent);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap}
.bar-title{font-weight:600;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:13px;font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center;white-space:nowrap}
.meter{width:110px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
@media (max-width:560px){.bar-title{display:none}.score{flex:1;justify-content:flex-end}.meter{width:70px}}

header.hero{padding:28px 0 8px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-read);font-weight:600;font-size:clamp(28px,6vw,40px);line-height:1.15;margin:6px 0 10px;text-wrap:balance}
.lede{color:var(--muted);max-width:70ch;margin:0}
.parts-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.parts-nav a{font-size:13px;color:var(--accent);text-decoration:none;background:var(--sheet);border:1px solid var(--line);border-radius:99px;padding:5px 12px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start;margin-top:24px}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.reading{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
@media (max-width:900px){.reading{position:static;max-height:none;overflow:visible}}
.reading h2{font-family:var(--f-read);font-weight:600;font-size:24px;margin:2px 0 14px;line-height:1.25}
.para{display:grid;grid-template-columns:2em 1fr;gap:4px;margin:0 0 14px;font-family:var(--f-read);font-size:17px;line-height:1.7}
.para .lb{font-family:var(--f-ui);font-weight:700;color:var(--accent);font-size:15px;padding-top:2px}
.para.flash{animation:flash 1.4s}
@keyframes flash{0%,60%{background:var(--accent-soft)}100%{background:transparent}}
.src{font-size:12px;color:var(--muted);margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
.w{background:linear-gradient(transparent 55%,var(--mark) 55%);color:var(--mark-ink);border:0;padding:0 1px;cursor:pointer;font-family:inherit;font-size:inherit;line-height:inherit;border-radius:2px}
.w:hover,.w.on{background:var(--mark)}
details.vocab{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.vocab summary{cursor:pointer;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.vlist{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 18px}
.vlist li{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:8px 0;border-top:1px solid var(--line)}
.vw{font-weight:600}.vw small{font-weight:400;color:var(--muted);margin-left:6px}
.vvi{font-size:14px;grid-column:1}
.say{grid-row:1/3;grid-column:2;border:0;background:var(--accent-soft);color:var(--accent);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.say svg{width:14px;height:14px}

section.part{margin-bottom:28px;scroll-margin-top:70px}
.part h3{font-family:var(--f-read);font-weight:600;font-size:22px;margin:0 0 4px}
.instr{color:var(--muted);font-size:14px;margin:0 0 10px}
.q{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-top:10px}
.q-top{display:flex;gap:10px;align-items:baseline}
.qn{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);min-width:2em}
.qt{flex:1;min-width:0}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:1px}
.quote{font-family:var(--f-read);font-style:italic}
.fig{margin:12px 0 0;border-radius:10px;overflow:hidden;border:1px solid var(--line);max-width:240px;background:var(--bg)}
.credit{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.5}
.fig img{display:block;width:100%;height:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px;margin:12px 0 0;padding:0;list-style:none}
.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-weight:700;color:var(--muted);min-width:1em}
.opt:disabled{cursor:default}
.ok{border-color:var(--good)!important;background:var(--good-soft)!important}
.ok .k{color:var(--good)}
.no{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.no .k{color:var(--bad)}
.why{margin-top:12px;border-radius:10px;padding:10px 12px;font-size:15px;background:var(--accent-soft)}
.why .vd{display:block;font-size:13px;font-weight:700;margin-bottom:2px}
.why.good .vd{color:var(--good)}.why.bad .vd{color:var(--bad)}
.goto{border:0;background:none;color:var(--accent);font-size:13px;padding:0;cursor:pointer;text-decoration:underline;margin-left:4px}

.bank{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin:0}
.bank ol{margin:0;padding-left:1.6em}
.bank li{padding:3px 0}
.bank li::marker{font-weight:700;color:var(--accent)}
.sel{width:100%;margin-top:10px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;cursor:pointer}
.sel:disabled{cursor:default;opacity:1}
.gaptext{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;font-family:var(--f-read);font-size:17px;line-height:1.75;margin-bottom:10px}
.gaptext h4{font-family:var(--f-ui);font-size:15px;margin:0 0 6px}
.gap{display:inline-block;min-width:2.6em;text-align:center;font-family:var(--f-ui);font-size:14px;font-weight:700;color:var(--accent);border-bottom:2px solid var(--accent);margin:0 2px;padding:0 4px}
.gap.filled{font-family:var(--f-read);font-weight:400;font-style:italic;color:var(--good);border-color:var(--good);text-align:left}

.result{margin-top:20px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.big{font-family:var(--f-read);font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:20px;color:var(--muted)}
.result p{margin:0;flex:1;min-width:200px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:99px;padding:7px 14px;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--sheet)}

.fab{display:none;position:fixed;right:16px;bottom:16px;z-index:25;border:0;background:var(--accent);color:var(--sheet);border-radius:99px;padding:11px 16px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer}
@media (max-width:900px){.fab{display:block}}
.drawer{position:fixed;inset:0;z-index:40;background:rgba(10,15,25,.45);display:flex;align-items:flex-end}
.drawer[hidden]{display:none}
.drawer .panel{background:var(--sheet);width:100%;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px 28px}
.drawer .close{float:right}

.pop{position:absolute;z-index:50;max-width:min(320px,calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.pop .ipa{opacity:.75;margin-left:6px}
.pop .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pop button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:99px;padding:2px 10px;font-size:12px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
</style>
</head>

<script>
const L = {"id": "L07", "book": "Good Manners at School", "pageTitle": "Lesson 07 · Tidy Desks, Happy Lunches", "eyebrow": "Lesson 07 · B1 · Good Manners at School · 20 câu", "heading": "Tidy Desks, Happy Lunches", "source": "Bài đọc phỏng theo Good Manners at School – Ann Ingalls (The Child's World, 2013), tr. 12–15.", "credit": "Tranh minh hoạ: Ronnie Rooney, trong Good Manners at School (The Child's World, 2013). Dùng cho mục đích học tập.", "reading": {"title": "Looking After School", "paras": [{"label": "A", "text": "Your teacher works hard to make your classroom a pleasant place, and the school spends money on {supplies|supplies} such as pencils, paper and crayons for everyone to use. Treat these things with care. Don't break pencils, and put supplies back where they {belong|belong} when you have finished with them. That way, the room stays neat and {tidy|tidy}."}, {"label": "B", "text": "Your own desk deserves the same attention. Keep your papers in neat piles and return crayons to their box. Don't let your desk turn into a {rubbish dump|rubbish dump}! And never {doodle|doodle} or {scribble|scribble} on the top of it; remember that another student will be using it next year. An {organised|organised} desk shows that you respect your school."}, {"label": "C", "text": "Lunchtime is fun, but manners still matter. Wait patiently in the lunch queue and don't stand too close to the person in front. Say \"please\" and \"thank you\" to the kitchen {staff|staff}, who work hard to prepare your meal."}, {"label": "D", "text": "At the table, chat quietly with your friends rather than shouting across the room. It's also a nice idea to invite someone new to sit with you. And of course, keep your food on your plate or in your mouth: food fights are not allowed! Interestingly, in many Japanese schools, students eat lunch in their classrooms, and classmates may even {serve|serve} the food."}, {"label": "E", "text": "When you have finished, take your tray to the bin and put cans and plastic in the {recycling|recycling}. Check that the table is clean, then walk, don't run, out of the lunchroom."}]}, "vocab": [{"key": "supplies", "word": "supplies", "ipa": "/səˈplaɪz/", "pos": "danh từ", "vi": "đồ dùng (học tập)"}, {"key": "belong", "word": "belong", "ipa": "/bɪˈlɒŋ/", "pos": "động từ", "vi": "thuộc về (đúng chỗ)"}, {"key": "tidy", "word": "tidy", "ipa": "/ˈtaɪdi/", "pos": "tính từ", "vi": "gọn gàng"}, {"key": "rubbish dump", "word": "rubbish dump", "ipa": "/ˈrʌbɪʃ dʌmp/", "pos": "danh từ", "vi": "bãi rác"}, {"key": "doodle", "word": "doodle", "ipa": "/ˈduːdl/", "pos": "động từ", "vi": "vẽ nguệch ngoạc"}, {"key": "scribble", "word": "scribble", "ipa": "/ˈskrɪbl/", "pos": "động từ", "vi": "viết/vẽ bậy"}, {"key": "organised", "word": "organised", "ipa": "/ˈɔːɡənaɪzd/", "pos": "tính từ", "vi": "ngăn nắp"}, {"key": "staff", "word": "staff", "ipa": "/stɑːf/", "pos": "danh từ", "vi": "nhân viên"}, {"key": "serve", "word": "serve", "ipa": "/sɜːv/", "pos": "động từ", "vi": "phục vụ, chia (đồ ăn)"}, {"key": "recycling", "word": "recycling", "ipa": "/ˌriːˈsaɪklɪŋ/", "pos": "danh từ", "vi": "thùng tái chế"}], "parts": [{"type": "match", "title": "Part 1 · Matching headings", "instr": "Chọn tiêu đề phù hợp nhất cho mỗi đoạn. Có 2 tiêu đề thừa.", "options": ["Caring for shared classroom things", "Your desk, your responsibility", "Being polite in the lunch queue", "Table talk and table rules", "Leaving the lunchroom properly", "How to win a food fight", "Decorating your desk with drawings"], "items": [{"label": "Paragraph A", "para": "A", "answer": 0, "tag": "Ý chính", "why": "Đoạn A: đồ dùng chung của lớp."}, {"label": "Paragraph B", "para": "B", "answer": 1, "tag": "Ý chính", "why": "Đoạn B: giữ bàn học của mình ngăn nắp."}, {"label": "Paragraph C", "para": "C", "answer": 2, "tag": "Ý chính", "why": "Đoạn C: xếp hàng lấy đồ ăn, cảm ơn nhân viên."}, {"label": "Paragraph D", "para": "D", "answer": 3, "tag": "Ý chính", "why": "Đoạn D: nói chuyện nhỏ, không ném đồ ăn."}, {"label": "Paragraph E", "para": "E", "answer": 4, "tag": "Ý chính", "why": "Đoạn E: dọn khay, phân loại rác, đi bộ ra ngoài."}]}, {"type": "questions", "title": "Part 2 · Reading comprehension", "instr": "Chọn đáp án đúng hoặc True / False.", "questions": [{"type": "mc", "tag": "Chi tiết", "q": "Why should you keep the top of your desk clean?", "options": ["Another student will use it next year.", "The teacher checks it every day.", "Drawings make the desk heavy.", "Crayons don't work on desks."], "why": "*another student will be using it next year.*"}, {"type": "tf", "tag": "Đúng / Sai", "q": "The school pays for supplies for students to use.", "answer": true, "why": "Đúng. *the school spends money on supplies.*"}, {"type": "mc", "tag": "Chi tiết", "q": "Who does the writer say you should thank at lunchtime?", "options": ["the kitchen staff", "the head teacher", "the students at the next table", "your parents"], "why": "*Say \"please\" and \"thank you\" to the kitchen staff.*"}, {"type": "mc", "tag": "Chi tiết", "q": "What is interesting about lunch in many Japanese schools?", "options": ["Students eat in their classrooms and may serve each other.", "Students cook their own lunch at home.", "Students never talk during lunch.", "Students eat lunch in the playground."], "why": "Đoạn D: ăn trong lớp, bạn cùng lớp chia đồ ăn."}, {"type": "tf", "tag": "Đúng / Sai", "q": "According to paragraph E, you can leave your tray on the table for the staff to clear.", "answer": false, "why": "Sai. *take your tray to the bin*."}, {"type": "mc", "tag": "Thông điệp", "q": "What connects all the advice in this text?", "options": ["respecting shared places and the people who look after them", "eating as quickly as possible", "making new friends at lunch", "getting good marks in class"], "why": "Bàn ghế, đồ dùng, nhà ăn đều là của chung – hãy tôn trọng."}]}, {"type": "questions", "title": "Part 3 · Picture tasks", "instr": "Quan sát tranh minh hoạ trong sách và trả lời.", "questions": [{"type": "mc", "tag": "Hình ảnh", "q": "Which sentence from the text does this picture show best?", "options": ["An organised desk shows that you respect your school.", "Food fights are not allowed!", "Wait patiently in the lunch queue.", "Walk, don't run, out of the lunchroom."], "why": "Cô bé lau bàn → đúng đoạn B.", "image": "images/sc-desk.jpg", "alt": "A girl sprays and wipes her desk while a teacher watches"}, {"type": "mc", "tag": "Hình ảnh", "q": "Which word best describes the desk after she finishes?", "options": ["tidy", "messy", "scribbled", "broken"], "why": "Sau khi lau dọn, bàn sẽ **tidy**.", "image": "images/sc-desk.jpg", "alt": "A girl sprays and wipes her desk while a teacher watches"}, {"type": "mc", "tag": "Hình ảnh", "q": "What is the boy most likely doing?", "options": ["putting his rubbish into the right bins after lunch", "choosing food from the lunch counter", "serving lunch to his classmates", "starting a food fight"], "why": "Đúng lời khuyên đoạn E: bỏ lon, nhựa vào thùng tái chế.", "image": "images/sc-tray.jpg", "alt": "A boy at a recycling station with bins for cans and plastic"}]}, {"type": "gap", "title": "Part 4 · Gapped text", "instr": "Đọc đoạn văn ngắn và chọn câu phù hợp cho mỗi chỗ trống. Có 2 câu thừa.", "textTitle": "Clean Desk Week", "text": "Our class decided to have a \"Clean Desk Week\". [1] At the end of each day, we checked each other's desks. [2] By Friday, our classroom looked better than ever. [3]", "options": ["Everyone promised to keep their papers organised and their pencils in their cases.", "Anyone whose desk was messy had to help tidy the bookshelf.", "Our teacher was so pleased that she gave us an extra ten minutes of break.", "We drew pictures all over the tops of our desks.", "Then we started a food fight in the lunchroom."], "items": [{"answer": 0, "tag": "Liên kết", "why": "Giải thích *Clean Desk Week* là gì: hứa giữ bàn ngăn nắp."}, {"answer": 1, "tag": "Liên kết", "why": "Sau khi kiểm tra bàn → ai bừa bộn phải dọn giá sách."}, {"answer": 2, "tag": "Liên kết", "why": "Kết quả: cô giáo hài lòng, thưởng thêm giờ ra chơi."}]}, {"type": "questions", "title": "Part 5 · Words in context", "instr": "Đoán nghĩa của từ/cụm từ dựa vào ngữ cảnh.", "questions": [{"type": "mc", "tag": "Từ vựng", "q": "*Don't let your desk turn into a rubbish dump!* (B). This means don't let your desk become…", "options": ["very messy and dirty", "a place to eat lunch", "too small", "a new desk"], "why": "Nói phóng đại: bàn bẩn như bãi rác."}, {"type": "mc", "tag": "Từ vựng", "q": "*…never doodle or scribble on the top of it* (B). To **doodle** is to…", "options": ["draw small pictures without thinking", "clean something carefully", "break something", "fold paper"], "why": "**Doodle** = vẽ nguệch ngoạc."}, {"type": "mc", "tag": "Từ vựng", "q": "*…put supplies back where they belong* (A). Here, **belong** means…", "options": ["are usually kept", "are bought", "are broken", "are borrowed"], "why": "**Where they belong** = đúng chỗ của chúng."}]}]};
const ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

let state={};
try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){state={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<span class="quote">$1</span>')
  .replace(/\(([A-E])\)/g,'(<button type="button" class="goto" data-para="$1">$1</button>)');
const ABC=i=>String.fromCharCode(65+i);
function seeded(n){let x=n*9301+49297;return()=>{x=(x*9301+49297)%233280;return x/233280}}

/* speech */
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_](US|GB)/i.test(v.lang)&&/Google|Samantha|Aria|Jenny|Natural/i.test(v.name))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g,''));u.lang='en-US';u.rate=.85;if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}}

/* reading */
document.title=L.pageTitle;
document.getElementById('barTitle').textContent=L.pageTitle;
document.getElementById('eyebrow').textContent=L.eyebrow;
document.getElementById('h1').textContent=L.heading;
const V={}; L.vocab.forEach(v=>V[v.key]=v);
const wordify=s=>esc(s).replace(/\{([^|}]+)\|([^}]+)\}/g,(_,d,k)=>`<button type="button" class="w" data-k="${k}">${d}</button>`);
function readingHTML(idp){
  return `<div class="eyebrow">Bài đọc</div><h2>${esc(L.reading.title)}</h2>`+
  L.reading.paras.map(p=>`<p class="para" id="${idp}${p.label}"><span class="lb">${p.label}</span><span>${wordify(p.text)}</span></p>`).join('')+
  `<details class="vocab" open><summary>Từ mới (${L.vocab.length})</summary><ul class="vlist">${L.vocab.map(v=>`<li><div class="vw">${esc(v.word)}<small>${esc(v.ipa)} · ${esc(v.pos)}</small></div><button class="say" type="button" aria-label="Nghe ${esc(v.word)}" data-say="${esc(v.word)}">${ICON}</button><div class="vvi">${esc(v.vi)}</div></li>`).join('')}</ul></details>`+
  `<div class="src">${esc(L.source)}</div>`;
}
document.getElementById('reading').innerHTML=readingHTML('pa');

/* parts */
const main=document.getElementById('main'), nav=document.getElementById('partsNav');
const Q={}; let n=0;
L.parts.forEach((part,pi)=>{
  const sid='part'+(pi+1);
  nav.insertAdjacentHTML('beforeend',`<a href="#${sid}">${esc(part.title.split('·')[0].trim())}</a>`);
  let h=`<section class="part" id="${sid}"><h3>${esc(part.title)}</h3><p class="instr">${esc(part.instr)}</p>`;
  if(part.type==='questions'){
    part.questions.forEach(q=>{
      n++; let opts, ans;
      if(q.type==='tf'){opts=['True','False'];ans=q.answer?0:1}
      else{const r=seeded(n*7+L.id.length);const idx=q.options.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}
        opts=idx.map(i=>q.options[i]);ans=idx.indexOf(q.answer||0)}
      Q[n]={kind:'btn',ans,why:q.why,label:i=>ABC(i)};
      h+=`<div class="q" id="q${n}"><div class="q-top"><span class="qn">${n}.</span><div class="qt">${q.tag?`<span class="tag">${esc(q.tag)}</span>`:''}${fmt(q.q)}</div></div>
        ${q.image?`<figure class="fig"><img src="${esc(q.image)}" alt="${esc(q.alt||'')}" loading="lazy"></figure>`:''}
        <ul class="opts">${opts.map((o,oi)=>`<li><button type="button" class="opt" data-q="${n}" data-o="${oi}"><span class="k">${ABC(oi)}</span><span>${fmt(o)}</span></button></li>`).join('')}</ul>
        <div class="why" hidden></div></div>`;
    });
  } else {
    // match / gap: shared option bank + one select per item
    const roman=['i','ii','iii','iv','v','vi','vii','viii','ix','x'];
    const lab=part.plain?(i=>part.options[i]):(i=>part.type==='match'?roman[i]:ABC(i).toLowerCase());
    if(part.type==='gap'){
      let t=esc(part.text).replace(/\[(\d+)\]/g,(_,k)=>`<span class="gap" id="g${n+ +k}">${n+ +k}</span>`);
      h+=`<div class="gaptext">${part.textTitle?`<h4>${esc(part.textTitle)}</h4>`:''}${t}</div>`;
    }
    if(!part.plain)h+=`<div class="bank"><ol type="${part.type==='match'?'i':'a'}">${part.options.map(o=>`<li>${esc(o)}</li>`).join('')}</ol></div>`;
    part.items.forEach((it,ii)=>{
      n++;
      Q[n]={kind:'sel',ans:it.answer,why:it.why,label:lab,text:part.options[it.answer],gap:part.type==='gap',plain:!!part.plain};
      const label=part.type==='match'?it.label:`Chỗ trống ${n}`;
      h+=`<div class="q" id="q${n}"><div class="q-top"><span class="qn">${n}.</span><div class="qt">${it.tag?`<span class="tag">${esc(it.tag)}</span>`:''}<b>${esc(label)}</b>${it.para?` <button type="button" class="goto" data-para="${it.para}">xem đoạn</button>`:''}</div></div>
        <select class="sel" data-q="${n}" aria-label="${esc(label)}"><option value="">— ${esc(part.pick||(part.type==='match'?'Chọn tiêu đề':'Chọn câu'))} —</option>${part.options.map((o,oi)=>`<option value="${oi}">${part.plain?esc(o):lab(oi)+'. '+esc(o)}</option>`).join('')}</select>
        <div class="why" hidden></div></div>`;
    });
  }
  main.insertAdjacentHTML('beforeend',h+'</section>');
});
const total=n;
main.insertAdjacentHTML('beforeend',`<div class="result" id="result"><div class="big" id="bigScore"></div><p id="resultMsg"></p><div class="acts"><button class="btn" id="btnWrong" type="button">Xem câu sai / chưa làm</button><button class="btn primary" id="btnReset" type="button">Làm lại từ đầu</button></div></div><p class="credit">${esc(L.source)}<br>${esc(L.credit||'')}</p>`);

/* answering */
function paint(i){
  const q=Q[i], box=document.getElementById('q'+i), pick=state[i];
  if(pick===undefined)return;
  const right=pick===q.ans;
  if(q.kind==='btn'){
    box.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const o=+b.dataset.o;if(o===q.ans)b.classList.add('ok');else if(o===pick)b.classList.add('no')});
  } else {
    const s=box.querySelector('.sel'); s.value=pick; s.disabled=true; s.classList.add(right?'ok':'no');
    if(q.gap){const g=document.getElementById('g'+i); if(g){g.textContent=q.text; g.classList.add('filled')}}
  }
  const why=box.querySelector('.why');
  why.className='why '+(right?'good':'bad');
  why.innerHTML=`<span class="vd">${right?'Đúng rồi!':'Chưa đúng. Đáp án: '+esc(q.label(q.ans))+(q.kind==='sel'&&!q.plain?' – '+esc(q.text||''):'')}</span>${fmt(q.why)}`;
  if(q.kind==='sel'&&!q.text){}
  why.hidden=false;
}
L.parts.forEach(p=>{if(p.type!=='questions')p.items.forEach(()=>{})});
// fill text for match items
(()=>{let k=0;L.parts.forEach(p=>{if(p.type==='questions'){k+=p.questions.length}else{p.items.forEach(it=>{k++;Q[k].text=p.options[it.answer]})}})})();

function updateScore(){
  let done=0,ok=0; for(const i in Q){if(state[i]!==undefined){done++;if(state[i]===Q[i].ans)ok++}}
  document.getElementById('scoreTxt').textContent=`Đúng ${ok}/${total} · Đã làm ${done}`;
  document.getElementById('meter').style.width=(done/total*100)+'%';
  document.getElementById('bigScore').innerHTML=`${ok}<small>/${total}</small>`;
  let m;
  if(done<total)m=`Bạn đã làm ${done}/${total} câu. Làm tiếp các câu còn lại nhé.`;
  else if(ok>=18)m='Xuất sắc! Bạn đọc hiểu rất tốt.';
  else if(ok>=14)m='Tốt lắm! Xem lại các câu sai và đọc kỹ phần giải thích nhé.';
  else if(ok>=10)m='Khá ổn. Ôn lại phần Từ mới rồi bấm "Làm lại từ đầu".';
  else m='Cố lên! Đọc lại bài thật chậm, học kỹ Từ mới rồi làm lại.';
  document.getElementById('resultMsg').textContent=m;
}
document.addEventListener('change',e=>{
  const s=e.target.closest('.sel'); if(!s||s.value==='')return;
  const i=+s.dataset.q; if(state[i]===undefined){state[i]=+s.value;save();paint(i);updateScore()}
});

/* drawer, popover, jumps */
const drawer=document.getElementById('drawer'), panel=document.getElementById('drawerPanel');
function openDrawer(label){
  panel.innerHTML='<button class="btn close" type="button" id="closeDr">Đóng ✕</button>'+readingHTML('dr');
  drawer.hidden=false; document.body.style.overflow='hidden';
  if(label){const el=document.getElementById('dr'+label); if(el){el.scrollIntoView({block:'center'});el.classList.add('flash')}}
}
function closeDrawer(){drawer.hidden=true;document.body.style.overflow='';hidePop()}
function gotoPara(label){
  if(matchMedia('(max-width:900px)').matches){openDrawer(label);return}
  const el=document.getElementById('pa'+label); if(!el)return;
  const box=document.getElementById('reading'); box.scrollTo({top:el.offsetTop-box.offsetTop-20,behavior:'smooth'});
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
const pop=document.getElementById('pop'); let popFor=null;
function showPop(w){
  if(popFor===w){hidePop();return} hidePop();
  const v=V[w.dataset.k]; if(!v)return; popFor=w; w.classList.add('on');
  pop.innerHTML=`<div class="row"><div><b>${esc(v.word)}</b><span class="ipa">${esc(v.ipa)}</span></div><button type="button" data-say="${esc(v.word)}">Nghe</button></div><div>${esc(v.pos)} · ${esc(v.vi)}</div>`;
  pop.hidden=false;
  const r=w.getBoundingClientRect(), pw=pop.offsetWidth;
  const fixed=!drawer.hidden; pop.style.position=fixed?'fixed':'absolute';
  const sx=fixed?0:scrollX, sy=fixed?0:scrollY;
  let x=r.left+sx; x=Math.max(16,Math.min(x,sx+document.documentElement.clientWidth-pw-16));
  pop.style.left=x+'px'; pop.style.top=(r.bottom+sy+6)+'px';
}
function hidePop(){pop.hidden=true;if(popFor)popFor.classList.remove('on');popFor=null}
document.addEventListener('click',e=>{
  const o=e.target.closest('.opt');
  if(o&&!o.disabled){const i=+o.dataset.q;if(state[i]===undefined){state[i]=+o.dataset.o;save();paint(i);updateScore()}return}
  const s=e.target.closest('[data-say]'); if(s){speak(s.dataset.say);return}
  const w=e.target.closest('.w[data-k]'); if(w){showPop(w);return}
  const g=e.target.closest('.goto'); if(g){gotoPara(g.dataset.para);return}
  if(e.target.id==='fab'){openDrawer();return}
  if(e.target.id==='closeDr'||e.target===drawer){closeDrawer();return}
  if(!e.target.closest('#pop'))hidePop();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hidePop();if(!drawer.hidden)closeDrawer()}});
window.addEventListener('resize',hidePop);
document.getElementById('reading').addEventListener('scroll',hidePop);
document.getElementById('btnReset').onclick=()=>{
  state={};save();
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=false;b.classList.remove('ok','no')});
  document.querySelectorAll('.sel').forEach(s=>{s.disabled=false;s.value='';s.classList.remove('ok','no')});
  document.querySelectorAll('.gap').forEach(g=>{g.textContent=g.id.slice(1);g.classList.remove('filled')});
  document.querySelectorAll('.why').forEach(w=>w.hidden=true);
  updateScore();scrollTo({top:0});
};
document.getElementById('btnWrong').onclick=()=>{
  const ids=Object.keys(Q).map(Number);
  const t=ids.find(i=>state[i]!==undefined&&state[i]!==Q[i].ans)||ids.find(i=>state[i]===undefined);
  if(t)document.getElementById('q'+t).scrollIntoView({block:'center'});
};
for(const i in Q)paint(+i);
updateScore();
</script>
</body>
</html>
